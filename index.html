<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cathy's Adventure">
<meta name="description" content="A playful letters, words and math game for pre-K and kindergarten.">
<title>Cathy's Learning Adventure</title>
<link rel="icon" href="app/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="app/icon-192.png">
<style>
  :root{--purple:#7c3aed;--purple-dark:#5b21b6;--pink:#ec4899;--ink:#312e52;--muted:#5d5a85;
    --display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Hiragino Maru Gothic ProN",Quicksand,Nunito,"Segoe UI",system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:var(--display);color:var(--ink);background:linear-gradient(160deg,#fef3ff,#e0f2fe 60%);}
  main{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.2vh,22px);
    padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));text-align:center;}
  .logo{width:min(32vh,58vw,210px);height:auto;aspect-ratio:1;border-radius:22%;box-shadow:0 14px 34px -8px rgba(91,33,182,.4);animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  h1{font-size:clamp(1.5rem,5.2vmin + .6rem,2.6rem);line-height:1.1;font-weight:700;max-width:14em;}
  .play{display:flex;align-items:center;justify-content:center;width:min(88vw,440px);height:clamp(84px,17vh,140px);border-radius:28px;text-decoration:none;
    color:#fff;font-weight:700;font-size:clamp(2.2rem,9vmin,3.6rem);letter-spacing:.02em;
    background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 9px 0 var(--purple-dark),0 18px 30px rgba(91,33,182,.3);transition:transform .1s,box-shadow .1s;}
  .play:active,.play.pressed{transform:translateY(7px);box-shadow:0 2px 0 var(--purple-dark),0 6px 12px rgba(91,33,182,.3);}
  .play:focus-visible{outline:5px solid #f59e0b;outline-offset:4px;}
  footer{font-size:.72rem;color:var(--muted);font-weight:700;line-height:1.3;}
  footer a{color:inherit;}
  @media (max-height:430px){main{flex-direction:row;flex-wrap:wrap;gap:8px 20px;align-content:center;}
    .logo{width:26vh;} h1{font-size:1.4rem;max-width:9em;text-align:left;} .play{width:min(44vw,320px);height:78px;font-size:2.2rem;} footer{flex-basis:100%;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<main>
  <img class="logo" src="app/icon-192.png" alt="" width="192" height="192">
  <h1>Cathy's Learning Adventure</h1>
  <a class="play" id="play" href="app/">▶ PLAY!</a>
  <footer>© 2026 LAZLAB Creations. All Rights Reserved. · <a href="mailto:lazlab.io@gmail.com">lazlab.io@gmail.com</a></footer>
</main>
<script>
// A little "pop" on tap, then go. Without JS the plain link still works.
(function(){
  var a=document.getElementById('play');
  a.addEventListener('click',function(e){
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button) return;
    e.preventDefault(); a.classList.add('pressed');
    try{
      var C=window.AudioContext||window.webkitAudioContext, c=new C(), o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(400,c.currentTime); o.frequency.exponentialRampToValueAtTime(800,c.currentTime+.08);
      g.gain.setValueAtTime(.3,c.currentTime); g.gain.linearRampToValueAtTime(.01,c.currentTime+.1);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.1);
    }catch(x){}
    setTimeout(function(){ location.href=a.getAttribute('href'); },220);
  });
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
</body>
</html>
