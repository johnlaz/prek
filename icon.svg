<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    
    <!-- Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow for Icon Elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312e52" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Main Owl & Star Group -->
  <g filter="url(#dropShadow)">
    <!-- Owl Outer Body -->
    <path d="M 156 120 C 120 120, 100 170, 100 240 C 100 370, 160 420, 256 420 C 352 420, 412 370, 412 240 C 412 170, 392 120, 356 120 C 320 120, 290 145, 256 145 C 222 145, 192 120, 156 120 Z" fill="#ffffff"/>
    
    <!-- Owl Belly Patch -->
    <path d="M 160 260 C 160 380, 352 380, 352 260 C 352 230, 160 230, 160 260 Z" fill="#f5f3ff"/>
    
    <!-- Belly Feathers Accent -->
    <path d="M 226 310 Q 256 325 286 310" stroke="#ddd6fe" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 236 340 Q 256 352 276 340" stroke="#ddd6fe" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Left Eye Group -->
    <circle cx="196" cy="210" r="42" fill="#ffffff" stroke="#e9e5fb" stroke-width="4"/>
    <circle cx="204" cy="210" r="24" fill="#312e52"/>
    <circle cx="212" cy="202" r="8" fill="#ffffff"/>

    <!-- Right Eye Group -->
    <circle cx="316" cy="210" r="42" fill="#ffffff" stroke="#e9e5fb" stroke-width="4"/>
    <circle cx="308" cy="210" r="24" fill="#312e52"/>
    <circle cx="316" cy="202" r="8" fill="#ffffff"/>

    <!-- Beak -->
    <polygon points="256,230 236,260 276,260" fill="url(#beakGrad)" id="beak"/>
    
    <!-- Graduation Cap / Learning Hat -->
    <path d="M 176 110 L 256 70 L 336 110 L 256 140 Z" fill="#312e52"/>
    <rect x="236" y="80" width="40" height="20" rx="4" fill="#312e52"/>
    <path d="M 320 115 L 320 155" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="320" cy="160" r="7" fill="#f59e0b"/>

    <!-- Golden Star Badge (Bottom Right) -->
    <g transform="translate(310, 290) scale(1.3)">
      <polygon points="40,2 52,26 78,30 59,48 64,74 40,62 16,74 21,48 2,30 28,26" fill="url(#starGrad)" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
